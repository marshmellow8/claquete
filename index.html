<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Claquete">
<meta name="theme-color" content="#000000">
<title>Claquete</title>
<style>
  :root{
    --linha:#3d3d3d;
    --rotulo:#7a7a7a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;overflow:hidden}
  body{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    color:#fff;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    user-select:none;-webkit-user-select:none;
  }

  /* ---- Tela de permissão ---- */
  #porta{
    position:fixed;inset:0;z-index:50;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:32px;text-align:center;
  }
  #porta h1{font-size:15px;letter-spacing:.22em;font-weight:700}
  #porta p{font-size:13px;line-height:1.65;color:var(--rotulo);max-width:30ch}
  #porta .status{font-size:11px;color:#555;margin-top:10px}
  #porta button{
    font:inherit;font-size:14px;font-weight:700;letter-spacing:.14em;
    background:#fff;color:#000;border:0;border-radius:5px;
    padding:16px 34px;cursor:pointer;
  }
  #porta button:active{opacity:.8}

  /* ---- Braço ---- */
  #braco{
    height:74px;flex-shrink:0;position:relative;overflow:hidden;
    border-bottom:2px solid #fff;
  }
  #listras{
    position:absolute;left:0;bottom:0;width:180%;height:52px;
    display:flex;transform-origin:0 100%;
    transform:rotate(-13deg);
    transition:transform .09s cubic-bezier(.2,.9,.3,1);
    border:2px solid #fff;
  }
  #listras.fechado{transform:rotate(0deg)}
  #listras div{flex:1}
  #listras div:nth-child(odd){background:#fff}
  #listras div:nth-child(even){background:#000}

  /* ---- Corpo ---- */
  #corpo{flex:1;display:flex;flex-direction:column;min-height:0}
  .linha{display:flex;border-bottom:1px solid var(--linha);flex:1;min-height:0}
  .celula{
    flex:1;padding:8px 13px;min-width:0;
    display:flex;flex-direction:column;justify-content:center;gap:3px;
    border-right:1px solid var(--linha);cursor:pointer;
  }
  .celula:last-child{border-right:0}
  .celula .rot{font-size:9px;font-weight:600;color:var(--rotulo);letter-spacing:.14em}
  .celula .val{
    font-size:clamp(32px,10vw,56px);font-weight:800;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .celula .val.pequeno{font-size:clamp(20px,5.5vw,28px)}
  /* quebra em ate duas linhas, cortando com reticencias na segunda */
  .celula .val.duasLinhas{
    white-space:normal;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
    overflow:hidden;line-height:1.1;
  }
  .celula .val.mini{font-size:clamp(15px,3.6vw,19px)}
  .celula .val.grande{font-size:clamp(26px,8vw,40px)}
  .celula .rot.grande{font-size:clamp(10px,1.8vw,12px)}
  .celula.aceso .val{color:#25e07a}

  /* ---- Controles ---- */
  #controles{
    flex-shrink:0;display:grid;grid-template-columns:repeat(3,1fr);
    gap:7px;padding:11px;background:#0d0d0d;
  }
  #controles button{
    font:inherit;font-size:9.5px;font-weight:700;letter-spacing:.1em;
    padding:11px 2px;border:0;border-radius:4px;
    background:#232323;color:#6d6d6d;cursor:pointer;
    transition:all .15s;
  }
  #controles button:active{opacity:.8}
  #controles button.on{background:#25e07a;color:#000}

  /* ---- Indicador de força ---- */
  #versao{
    position:fixed;top:calc(env(safe-area-inset-top) + 4px);left:8px;
    font-size:9px;color:#454545;z-index:20;letter-spacing:.06em;font-weight:600;
  }
  #forca{
    position:fixed;top:calc(env(safe-area-inset-top) + 4px);right:8px;
    font-size:9px;color:#454545;z-index:20;letter-spacing:.06em;
    font-weight:600;
  }

  /* ---- Editor ---- */
  #editor{
    position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);
    display:none;flex-direction:column;justify-content:center;
    gap:18px;padding:34px;
  }
  #editor.aberto{display:flex}
  #editor label{font-size:10px;letter-spacing:.2em;color:var(--rotulo)}
  #editor input{
    font:inherit;font-size:26px;font-weight:800;
    background:#181818;color:#fff;border:1px solid var(--linha);
    border-radius:5px;padding:15px;width:100%;
  }
  #editor .botoes{display:flex;gap:11px}
  #editor .botoes button{
    flex:1;font:inherit;font-size:12px;font-weight:700;letter-spacing:.12em;
    padding:15px;border:0;border-radius:5px;background:#232323;color:#fff;cursor:pointer;
  }
  #editor .botoes button:active{opacity:.8}
  #editor .botoes button.principal{background:#fff;color:#000}
</style>
</head>
<body>

<div id="porta">
  <h1>CLAQUETE</h1>
  <p>Toque para liberar o acelerômetro e o áudio. O iOS exige que isso venha de um toque seu.</p>
  <div class="status" id="portaStatus"></div>
  <button id="btnPorta">INICIAR</button>
</div>

<div id="forca">—</div>
<div id="versao">v2.7</div>

<div id="braco"><div id="listras"></div></div>

<div id="corpo">
  <div class="linha">
    <div class="celula" data-edita="producao">
      <div class="rot grande">PRODUÇÃO</div>
      <div class="val grande duasLinhas" id="v-producao">PRODUÇÃO</div>
    </div>
    <div class="celula" id="clap" style="flex:0 0 17%">
      <div class="rot">CLAP</div>
      <div class="val mini" id="v-clap">1</div>
    </div>
  </div>
  <div class="linha">
    <div class="celula" id="cena"><div class="rot">CENA</div><div class="val" id="v-cena">1</div></div>
    <div class="celula" id="head"><div class="rot">HEAD</div><div class="val" id="v-head">1</div></div>
    <div class="celula" id="take"><div class="rot">TAKE</div><div class="val" id="v-take">1</div></div>
  </div>
  <div class="linha">
    <div class="celula" data-edita="observacoes">
      <div class="rot">OBSERVAÇÕES</div>
      <div class="val pequeno duasLinhas" id="v-observacoes">—</div>
    </div>
  </div>
  <div class="linha">
    <div class="celula"><div class="rot">HORA</div><div class="val pequeno" id="v-hora">—</div></div>
    <div class="celula"><div class="rot">DATA</div><div class="val pequeno" id="v-data">—</div></div>
  </div>
</div>

<div id="controles">
  <button id="c-gesto" class="on">GESTO</button>
  <button id="c-auto" class="on">AUTO TAKE</button>
  <button id="c-mute">MUTE</button>
</div>

<div id="editor">
  <label id="ed-rot">CAMPO</label>
  <input id="ed-input" autocapitalize="characters" autocomplete="off" spellcheck="false">
  <div class="botoes">
    <button id="ed-cancela">CANCELAR</button>
    <button id="ed-ok" class="principal">OK</button>
  </div>
</div>

<script>
"use strict";

/* ================= Estado ================= */
const S = {
  producao:"PRODUÇÃO", observacoes:"—", head:1, cena:"1",
  take:1, clapIdx:0,
  gesto:true, auto:true, mute:false,
  batendo:false
};

/* ================= Audio ================= */
/* Os quatro claps ficam no mesmo diretorio do index.html:
   clap1.wav ... clap4.wav. Todos sao decodificados no INICIAR,
   para que a batida nao espere por rede nem por decode. */

const CLAPS = ["clap1.wav", "clap2.wav", "clap3b.wav", "clap4b.wav"];
let ctx = null;
const buffers = [null, null, null, null];

function iniciarAudio(){
  ctx = new (window.AudioContext || window.webkitAudioContext)({latencyHint:"interactive"});

  // desbloqueio do iOS: precisa de um som disparado dentro do gesto
  const mudo = ctx.createBufferSource();
  mudo.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
  mudo.connect(ctx.destination);
  mudo.start(0);

  CLAPS.forEach((nome, i) => {
    fetch(nome)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(a => ctx.decodeAudioData(a))
      .then(b => { buffers[i] = b; render(); })
      .catch(() => { buffers[i] = null; render(); });
  });
}

function tocarClap(){
  const b = buffers[S.clapIdx];
  if (!ctx || !b) return;
  if (ctx.state === "suspended") ctx.resume();
  const src = ctx.createBufferSource();
  src.buffer = b;
  src.connect(ctx.destination);
  src.start(0);
}

/* ================= Detecção do impacto ================= */
/* Máquina de estado: sobe → pico → cai → impacto. Dispara na desaceleração
   brusca (o braço parando), não no pico do movimento. Valores em m/s²,
   sobre a aceleração sem gravidade. */
const D = {
  limiarPico:  12.1,    // começa a rastrear quando passa disso
  quedaMinima: 5.2,    // tem que cair pelo menos isso do pico
  intervaloMin: 2000,   // ms de cooldown
  
  anterior: 0, 
  subindo: false, 
  pico: 0, 
  ultimo: 0
};

function processarMovimento(ev){
  const a = ev.acceleration;
  if (!a || a.x === null) return;
  
  const m = Math.hypot(a.x, a.y, a.z);
  
  elForca.textContent = m.toFixed(2);

  if (S.gesto){
    if (m > D.limiarPico && m > D.anterior){          // subindo
      D.subindo = true;
      D.pico = Math.max(D.pico, m);
    }
    else if (D.subindo && (D.pico - m) >= D.quedaMinima){   // impacto
      D.subindo = false;
      D.pico = 0;
      
      const agora = Date.now();
      if (agora - D.ultimo > D.intervaloMin){
        D.ultimo = agora;
        bater();
      }
    }
    else if (m < 0.3){                                 // repouso
      D.subindo = false;
      D.pico = 0;
    }
  }
  D.anterior = m;
}

/* ================= Ação ================= */
function bater(){
  if (S.batendo) return;
  S.batendo = true;

  // MUTE silencia apenas o audio; o braco e o take seguem normais.
  listras.classList.add("fechado");
  elTake.classList.add("aceso");

  if (navigator.vibrate) navigator.vibrate(18);
  if (!S.mute) tocarClap();

  setTimeout(() => {
    listras.classList.remove("fechado");
    elTake.classList.remove("aceso");
    S.batendo = false;
    if (S.auto){ S.take++; render(); }
  }, 900);
}

/* ================= Render ================= */
const $ = id => document.getElementById(id);
const listras = $("listras");
const elTake  = $("take");
const elForca = $("forca");

for (let i = 0; i < 14; i++) listras.appendChild(document.createElement("div"));

function render(){
  $("v-producao").textContent = S.producao;
  $("v-observacoes").textContent = S.observacoes;
  $("v-head").textContent     = S.head;
  $("v-cena").textContent     = S.cena;
  $("v-take").textContent     = S.take;
  $("v-clap").textContent     = S.clapIdx + 1;
  $("v-clap").style.opacity   = buffers[S.clapIdx] ? "1" : "0.3";
}

function relogio(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  $("v-data").textContent = `${p(d.getDate())}/${p(d.getMonth()+1)}`;
  $("v-hora").textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
setInterval(relogio, 500); relogio(); render();

/* ================= Interação ================= */
/* Pointer events funcionam em toque e mouse. Toque curto incrementa,
   toque longo (600 ms) reseta. O reset dá um flash verde de confirmação. */

function contador(id, incrementar, resetar){
  const el = $(id);
  let timer = null, resetou = false;

  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    resetou = false;
    timer = setTimeout(() => {
      resetou = true;
      resetar();
      render();
      if (navigator.vibrate) navigator.vibrate(30);
      el.classList.add("aceso");
      setTimeout(() => el.classList.remove("aceso"), 220);
    }, 600);
  });

  const soltar = () => {
    if (timer){ clearTimeout(timer); timer = null; }
    if (!resetou){ incrementar(); render(); }
    resetou = false;
  };

  el.addEventListener("pointerup", e => { e.preventDefault(); soltar(); });
  el.addEventListener("pointercancel", () => { if (timer) clearTimeout(timer); timer = null; });
  el.addEventListener("pointerleave", () => { if (timer) clearTimeout(timer); timer = null; });
}

contador("cena", () => { S.cena = String(parseInt(S.cena) + 1); S.take = 1; },
                () => { S.cena = "1"; S.take = 1; });
contador("head", () => { S.head++; }, () => { S.head = 1; });
contador("take", () => { S.take++; }, () => { S.take = 1; });

/* CLAP: toque cicla entre os quatro, toque longo pre-escuta o atual */
contador("clap", () => { S.clapIdx = (S.clapIdx + 1) % CLAPS.length; },
                 () => { tocarClap(); });

function alterna(id, chave){
  $(id).addEventListener("click", () => {
    S[chave] = !S[chave];
    $(id).classList.toggle("on", S[chave]);
    if (chave === "gesto"){
      if (S.gesto && "DeviceMotionEvent" in window){
        window.addEventListener("devicemotion", processarMovimento);
      } else {
        window.removeEventListener("devicemotion", processarMovimento);
      }
    }
    render();
  });
}
alterna("c-gesto","gesto");
alterna("c-auto","auto");
alterna("c-mute","mute");

let ultimoToque = 0;
$("corpo").addEventListener("click", e => {
  if (e.target.closest("[data-edita],#cena,#head,#take")) return;
  const agora = Date.now();
  if (agora - ultimoToque < 320) bater();
  ultimoToque = agora;
});
$("braco").addEventListener("click", bater);

/* ================= Editor de campos ================= */
let campoAtual = null;
const ROTULOS = {producao:"PRODUÇÃO", observacoes:"OBSERVAÇÕES", head:"HEAD", cena:"CENA"};

document.querySelectorAll("[data-edita]").forEach(el => {
  el.addEventListener("click", () => {
    campoAtual = el.dataset.edita;
    $("ed-rot").textContent = ROTULOS[campoAtual];
    $("ed-input").value = S[campoAtual];
    $("editor").classList.add("aberto");
    setTimeout(() => $("ed-input").focus(), 60);
  });
});

$("ed-cancela").addEventListener("click", () => $("editor").classList.remove("aberto"));
$("ed-ok").addEventListener("click", () => {
  const v = $("ed-input").value.trim();
  if (v){
    S[campoAtual] = v;
    if (campoAtual === "cena") S.take = 1;
  }
  $("editor").classList.remove("aberto");
  render();
});

$("ed-input").addEventListener("keydown", e => {
  if (e.key === "Enter") $("ed-ok").click();
  if (e.key === "Escape") $("ed-cancela").click();
});

/* ================= Inicialização ================= */
const portaStatus = $("portaStatus");

$("btnPorta").addEventListener("click", async () => {
  try { iniciarAudio(); } catch(e){ console.error("Audio init:", e); }

  // Tentar pedir permissão (iOS 13+)
  if (typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function"){
    try {
      const r = await DeviceMotionEvent.requestPermission();
      if (r === "granted"){
        window.addEventListener("devicemotion", processarMovimento);
        portaStatus.textContent = "Acelerômetro liberado ✓";
      } else {
        S.gesto = false;
        $("c-gesto").classList.remove("on");
        portaStatus.textContent = "Permissão negada";
      }
    } catch(e){
      console.error("Permission request failed:", e);
      S.gesto = false;
      $("c-gesto").classList.remove("on");
      portaStatus.textContent = "Erro ao solicitar permissão";
    }
  } else {
    // Android ou navegadores sem requestPermission
    window.addEventListener("devicemotion", processarMovimento);
    portaStatus.textContent = "Acelerômetro ativo (sem permissão necessária)";
  }

  setTimeout(() => {
    $("porta").style.display = "none";
  }, 600);
});

/* Screen wake lock */
if ("wakeLock" in navigator){
  const manter = () => navigator.wakeLock.request("screen").catch(()=>{});
  $("btnPorta").addEventListener("click", manter);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") manter();
  });
}
</script>
</body>
</html>
